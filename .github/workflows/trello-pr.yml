name: Trello - Pull Requests

on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, ready_for_review, closed]

concurrency:
  group: trello-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  mover-card:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/trello-pr.mjs --selftest
      - run: node scripts/trello-pr.mjs
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}

  # Depois do merge: roda a build. Se passar, tira o card de Awaiting Build
  # (vai para Awaiting QA, ou direto para Done se for documentação ou configuração).
  build-e-qa:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    needs: mover-card
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/trello-pr.mjs --apos-build
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
