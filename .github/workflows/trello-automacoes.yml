name: Automações do Trello

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Um só por vez, para duas execuções nunca moverem os mesmos cards ao mesmo tempo.
concurrency:
  group: trello-automacoes
  cancel-in-progress: false

jobs:
  automacoes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/automacoes.mjs --selftest
      - run: node scripts/automacoes.mjs
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
